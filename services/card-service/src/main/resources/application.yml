server:
  port: ${PORT:${SERVER_PORT:8081}}

spring:
  datasource:
    # Local Compose sets DB_URL. On Railway, PG* are injected from the Postgres plugin.
    url: ${DB_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:bank_db}}
    username: ${DB_USER:${PGUSER:bank_user}}
    password: ${DB_PASSWORD:${PGPASSWORD:bank_password}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  cache:
    type: redis

management:
  endpoints:
    web:
      discovery:
        enabled: false
      exposure:
        # Public surface: health only (Railway/Compose probes + frontend healthprobe.sh).
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
