server:
  port: ${PORT:${SERVER_PORT:8082}}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bank_db}
    username: ${DB_USER:bank_user}
    password: ${DB_PASSWORD:bank_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    open-in-view: false
  rabbitmq:
    # CloudAMQP free tier: set RABBITMQ_HOST / USER / PASSWORD / PORT (5671) + SSL,
    # or pass a full AMQP URL via SPRING_RABBITMQ_ADDRESSES / standard Boot bindings.
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:bank_guest}
    password: ${RABBITMQ_PASSWORD:bank_guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    ssl:
      enabled: ${RABBITMQ_SSL:false}

app:
  rabbitmq:
    exchange: bank.events
    queue: credit.scoring.queue
    routing-key: credit.calculated
  credit:
    annual-interest-rate: ${CREDIT_ANNUAL_INTEREST_RATE:8.5}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
